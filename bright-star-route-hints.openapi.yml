    ProductId: { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    FeedbackId: { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    BasketItemId: { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    ChallengeId: { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
