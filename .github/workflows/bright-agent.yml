# Bright Agent — GitHub Actions workflow for OWASP Juice Shop
#
# Agentic DAST: checks out this repo, boots the app, scans the live endpoints,
# and commits/PRs verified fixes.
#
# The workflow runs on two triggers:
#
#   • workflow_dispatch → manual full scan, launched by hand on a chosen branch.
#   • issue_comment     → a repo OWNER / MEMBER / COLLABORATOR comments
#                         `/bright-agent <guidance>` (lowercase) on a PR; runs
#                         that PR with the guidance routed to the right phase.
#
# IMPORTANT for steering: GitHub only triggers `issue_comment` workflows from
# the file on your repo's DEFAULT branch — so this workflow must be merged to
# the default branch for `/bright-agent` replies to work.
#
# Runner prerequisites: Docker, Docker Compose, Git, curl, sha256sum (all on
# GitHub-hosted `ubuntu-latest`).
#
# Required repository secrets:
#     BRIGHT_TOKEN      Bright API token from https://app.brightsec.com
#     INFERENCE_TOKEN   API token for your OpenAI-compatible inference endpoint
#   and repository variables:
#     INFERENCE_URL     that endpoint's base URL (OpenAI, GitHub Models, Ollama, …)
#     BRIGHT_HOSTNAME   Bright instance hostname (optional, e.g. app.brightsec.com)
#     BRIGHT_PROJECT    Bright project ID the scan runs under (required when the
#                       token can see more than one project)
#
# Repo access uses the built-in GITHUB_TOKEN (see `permissions:`).

name: Bright Agent (STAR)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Required mode for this manual run"
        required: true
        default: "full-auth-stub"
        type: choice
        options:
          # RUN_MODE=full with BRIGHT_AUTH_STUB=on: boot the real app and force
          # the transient authentication stub. Function mode is never allowed.
          - full-auth-stub

# contents: write     → commit fixes onto the (PR head or scan) branch
# pull-requests: write → open/update the PR + summary comment + reactions
# statuses: write     → set the "Bright Agent" commit status
permissions:
  contents: write
  pull-requests: write
  statuses: write

# One run per PR (its /bright-agent replies); else per ref (manual dispatch).
concurrency:
  group: bright-agent-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  bright-agent:
    # Trigger gates:
    #  • issue_comment: a lowercase `/bright-agent` comment from a repo
    #                   OWNER / MEMBER / COLLABORATOR on a PR.
    #  • workflow_dispatch: always.
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/bright-agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Runner platform/arch: linux-x64 | linux-arm64 | darwin-x64 | darwin-arm64
      ASSET: bright-agent-linux-x64
    steps:
      # For a `/bright-agent` comment: resolve the PR over the API and REFUSE
      # fork PRs BEFORE any checkout. issue_comment runs in the base-repo context
      # with secrets in scope, so checking out and running a fork's head would
      # leak them. Outputs the head/base refs the run binds to.
      - name: Resolve steering PR (refuse forks)
        id: steer
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const sameRepo =
              pr.head.repo &&
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body:
                  "🔒 `/bright-agent` steering is not available on fork PRs for " +
                  "security reasons (it would run untrusted code with repository " +
                  "secrets). Push the branch to this repository to use it.",
              });
              core.setFailed("Steering disabled on fork PRs.");
              return;
            }
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("base_ref", pr.base.ref);

      # Check out the tree to scan. steering (`/bright-agent`) → the PR head
      # branch (so fixes commit back to it); manual dispatch → the chosen ref.
      # Download the binary OUTSIDE this checkout so it's never swept into a fix
      # commit.
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ (github.event_name == 'issue_comment' && steps.steer.outputs.head_ref)
              || github.ref }}
          fetch-depth: 0

      - name: Validate clean STAR baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ inputs.scan_mode }}" = "full-auth-stub"

          base_sha="$(git rev-parse origin/master)"
          test "$(git merge-base origin/master HEAD)" = "${base_sha}"

          unexpected="$(git diff --name-only origin/master...HEAD | grep -Ev '^(\.github/workflows/bright-agent\.yml|\.github/scripts/(strict-bright-agent-supervisor|test-strict-bright-agent-supervisor)\.py|BRIGHT_STAR\.md|bright-star-route-hints\.openapi\.yml)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "::error::Application files differ from origin/master: ${unexpected}"
            exit 1
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          hints = Path("bright-star-route-hints.openapi.yml").read_text()
          server = Path("server.ts").read_text()
          paths = hints.split("\npaths:\n", 1)[1].split("\ncomponents:\n", 1)[0]
          operations = re.findall(r"^    (?:get|post|put|delete):$", paths, re.M)
          cases = re.findall(r"^  - old:", hints, re.M)
          block = re.search(r"const autoModels = \[(.*?)\n  \]", server, re.S)
          models = re.findall(r"name: '([^']+)'", block.group(1)) if block else []

          assert len(models) == 13, models
          assert len(operations) == 65, len(operations)
          assert len(cases) == 22, len(cases)
          for model in models:
              collection = f"/api/{model}s"
              assert f"  {collection}:" in paths, collection
              assert f"  {collection}/{{id}}:" in paths, collection

          print(f"Validated {len(models)} Finale resources, {len(operations)} CRUD routes, and {len(cases)} baseline cases")
          PY

      - name: Test strict no-harness supervisor
        run: python3 .github/scripts/test-strict-bright-agent-supervisor.py

      - name: Download & verify Bright Agent
        working-directory: ${{ runner.temp }}
        run: |
          # Pin the reviewed release so this costly baseline is reproducible.
          base="https://github.com/NeuraLegion/bright-agent-dist/releases/download/v0.1.51"
          curl -fsSL -o "${ASSET}" "${base}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${base}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          chmod +x "${ASSET}"

      - name: Bright Agent preflight
        env:
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME }}
          BRIGHT_PROJECT_ID: ${{ vars.BRIGHT_PROJECT }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          AI_MODEL: "gpt-5.6-luna,gpt-5.6-sol"
          RUN_MODE: full
          BRIGHT_AUTH_STUB: "on"
          BRIGHT_PREFLIGHT_ONLY: "1"
        run: >-
          python3 .github/scripts/strict-bright-agent-supervisor.py
          "${{ runner.temp }}/${{ env.ASSET }}"

      - name: Run Bright Agent
        env:
          # Run against the checked-out tree. REPOSITORY_URL is derived from the
          # checkout's `origin` remote (set REPOSITORY_URL to override).
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME }}
          # Bright project ID the scan runs under. The agent reads BRIGHT_PROJECT_ID
          # (see config.ts); required because the token can see many projects and
          # the agent never picks one itself. Sourced from the BRIGHT_PROJECT repo var.
          BRIGHT_PROJECT_ID: ${{ vars.BRIGHT_PROJECT }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          # Steering inputs — populated only for a `/bright-agent` comment; empty
          # for every other trigger, so the agent runs a normal scan.
          BRIGHT_STEERING_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          BRIGHT_STEERING_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          BRIGHT_STEERING_AUTHOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || '' }}
          BRIGHT_STEERING_AUTHOR_ASSOCIATION: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || '' }}
          BRIGHT_STEERING_PR_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || '' }}
          BRIGHT_STEERING_PR_HEAD: ${{ steps.steer.outputs.head_ref }}
          BRIGHT_STEERING_PR_BASE: ${{ steps.steer.outputs.base_ref }}
          # Diff-scope the run to the PR's changes. On an `issue_comment`
          # (`/bright-agent`) trigger GITHUB_BASE_REF is empty, so the agent
          # cannot auto-derive the PR base — pass it explicitly as the diff base
          # so the scan is narrowed to the changed endpoints instead of the
          # whole repo. Empty on workflow_dispatch → normal (full) scan.
          DIFF_BASE: ${{ steps.steer.outputs.base_ref && format('origin/{0}', steps.steer.outputs.base_ref) || '' }}
          # Scan scope: on a `/bright-agent` comment DIFF_BASE above narrows the
          # scan to the PR diff; set SCAN_SCOPE=changed to force diff-only (bails
          # on docs-only PRs) or SCAN_SCOPE=full to force a full scan. On
          # workflow_dispatch the run is a full scan.
          # This config branch is only for the manual full baseline.
          SCAN_SCOPE: full
          # --- Scan mode ---
          # This branch permits only a real-app run with the auth stub forced on.
          # The supervisor fails the job before any function harness can continue.
          RUN_MODE: full
          BRIGHT_AUTH_STUB: "on"
          # --- Detailed stats & diagnostics ---
          BRIGHT_DEBUG: "1"
          BRIGHT_DUMP_TURNS: "1"
          BRIGHT_DUMP_DIR: ${{ runner.temp }}/bright-dumps
          # Fixed model chain: start with Luna, then escalate to Sol.
          AI_MODEL: "gpt-5.6-luna,gpt-5.6-sol"
        run: >-
          python3 .github/scripts/strict-bright-agent-supervisor.py
          "${{ runner.temp }}/${{ env.ASSET }}"

      # --- Artifact uploads (always run, even on failure) ---

      - name: Upload Bright Agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-logs
          path: ~/.bright-agent/logs/
          if-no-files-found: ignore

      - name: Upload LLM turn dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-turn-dumps
          path: ${{ runner.temp }}/bright-dumps/
          if-no-files-found: ignore

# NOTE: commits/PRs/comments made with GITHUB_TOKEN do not trigger your other
# workflows (GitHub's anti-recursion rule). To have fix commits re-run your
# repo's CI, use a PAT instead:
#     REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
