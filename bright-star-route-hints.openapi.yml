openapi: 3.0.3
info:
  title: OWASP Juice Shop STAR route hints
  version: 1.0.0
  description: >-
    Source-backed route and baseline hints for Bright Agent. This file supplements
    swagger.yml, which only describes the mounted /b2b/v2 API.
servers:
  - url: /

x-bright-source-contract:
  evidence: server.ts
  finaleResourceCount: 13
  methodsPerResource: 5
  finaleGeneratedOperationCount: 65
  finaleMethods:
    collection: [GET, POST]
    item: [GET, PUT, DELETE]
  rules:
    - Inventory every operation under paths before parameter extraction.
    - Finale does not generate PATCH routes here.
    - Keep direct routes at their source paths; never add an /api prefix.
    - Register operations marked x-bright-register true.
    - Do not register deliberate denyAll, credential, destructive, or broken operations.
    - Resolve dynamic MarsDB IDs through the listed resolver request.

x-bright-auth-profiles:
  primary:
    source: data/static/users.yml
    login:
      method: POST
      path: /rest/user/login
      contentType: application/json
      body: { email: admin@juice-sh.op, password: admin123 }
    inject:
      - 'Authorization: Bearer <authentication.token>'
      - 'Cookie: token=<authentication.token>'
    notes:
      - UserId 1 owns BasketId 1 and has seeded cards and a security answer.
      - Refresh the login after each application restart.
  accounting:
    source: data/static/users.yml
    login:
      method: POST
      path: /rest/user/login
      contentType: application/json
      body: { email: accountant@juice-sh.op, password: 'i am an awesome accountant' }
    inject:
      - 'Authorization: Bearer <authentication.token>'
    notes:
      - Use only for /rest/order-history role checks.
      - This is a public training-app fixture, not an external credential.

